<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <!-- Photos load as plain <img> (no CORS), so these preconnects omit crossorigin. -->
    <link rel="preconnect" href="https://en.wikipedia.org" />
    <link rel="preconnect" href="https://thumb.wikimedia.org" />
    <link rel="preconnect" href="https://upload.wikimedia.org" />
    <title>TripWise | Plan the journey</title>
    <meta name="description" content="Plan trips with real places. Explore any city, save the spots you like, and turn one city or a multi-city route into an editable day-by-day itinerary." />
    <meta name="theme-color" content="#F7F3EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20283A" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack, X). og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripWise" />
    <meta property="og:title" content="TripWise | Plan the journey" />
    <meta property="og:description" content="Real places, arranged into days you can change. Plan one city or a whole route." />
    <meta property="og:url" content="https://trip-wise-phi.vercel.app/" />
    <meta property="og:image" content="https://trip-wise-phi.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TripWise: a dotted globe with a flight path and a sample day in Kyoto." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripWise | Plan the journey" />
    <meta name="twitter:description" content="Real places, arranged into days you can change. Plan one city or a whole route." />
    <meta name="twitter:image" content="https://trip-wise-phi.vercel.app/og-image.png" />
    <script>
      try {
        const savedTheme = localStorage.getItem('tripwise-theme')
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme
          document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', savedTheme)
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
